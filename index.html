<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <!-- This site ships its own dark theme. Tell the browser so it renders form
         controls, scrollbars and the canvas ground dark natively rather than
         painting a white default underneath. -->
    <meta name="color-scheme" content="dark">
    <!-- Dark Reader's opt-out. Without it the extension parses every stylesheet,
         rewrites the gradients and glows the vaporwave theme is built from, and
         re-runs that analysis on every DOM mutation - and the experience
         backdrop swaps a whole scene subtree per job as you scroll. The result
         is unusable on a page that was already dark to begin with. -->
    <meta name="darkreader-lock">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="description" content="Andrew (Drew) Paettie, security architect and platform engineer in Washington. FedRAMP, Kubernetes, Azure, AWS, and aerospace." />
    <title>Drew Paettie — Security Architect &amp; Platform Engineer</title>
    <!-- Link previews (Slack, LinkedIn, iMessage, Discord...). Crawlers do not
         run JS, so these have to be static. og:image must be an absolute URL;
         the image is a 1200x630 capture of the home hero. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andrewpaettie.com/" />
    <meta property="og:site_name" content="Andrew Paettie" />
    <meta property="og:title" content="Drew Paettie — Security Architect &amp; Platform Engineer" />
    <meta property="og:description" content="Security architect and platform engineer building secure, reliable distributed systems. FedRAMP, Kubernetes, Azure, AWS, and aerospace." />
    <meta property="og:image" content="https://andrewpaettie.com/img/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Drew Paettie — security architect and platform engineer building secure, reliable distributed systems" />
    <meta name="twitter:card" content="summary_large_image" />
</head>
